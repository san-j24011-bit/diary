<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f4" />
    <title>日々の記録 | 日記</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="日々の記録 ホーム">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span class="brand-name">日々の記録</span>
        </a>
        <div class="topbar-note"><span class="privacy-dot"></span>保存時にスプレッドシートへ同期します</div>
      </header>

      <main class="workspace">
        <aside class="journal-rail" aria-label="日記一覧">
          <div class="rail-heading">
            <div>
              <p class="overline">YOUR JOURNAL</p>
              <h1>日記</h1>
            </div>
            <button class="icon-button new-entry-button" id="new-entry" type="button" aria-label="新しい日記" title="新しい日記">
              <span aria-hidden="true">＋</span>
            </button>
          </div>

          <label class="search-box">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <span class="visually-hidden">日記を検索</span>
            <input id="search" type="search" placeholder="日記を検索" autocomplete="off" />
            <kbd>/</kbd>
          </label>

          <div class="list-heading">
            <span>これまでの日記</span>
            <span class="entry-count" id="entry-count">0</span>
          </div>
          <div class="entry-list" id="entry-list" aria-live="polite"></div>
          <div class="rail-footer">
            <span class="footer-spark" aria-hidden="true">✳</span>
            <span>書き留めた日々は、<br />いつでもここに。</span>
          </div>
        </aside>

        <section class="editor-area" aria-label="日記を書く">
          <div class="editor-topline">
            <div class="today-label"><span class="today-dot"></span><span id="date-label">今日の記録</span></div>
            <div class="save-state" id="save-state" aria-live="polite">
              <span class="save-indicator"></span><span id="save-message">保存されています</span>
            </div>
          </div>

          <form id="entry-form" class="entry-form">
            <div class="date-row">
              <label class="date-label" for="entry-date">日付</label>
              <input id="entry-date" name="date" type="date" required />
              <button class="text-button delete-button" id="delete-entry" type="button" hidden>日記を削除</button>
            </div>

            <input class="title-input" id="entry-title" name="title" type="text" maxlength="100" placeholder="今日をひとことで" autocomplete="off" aria-label="日記のタイトル" />

            <div class="mood-row">
              <span class="field-label">今日の気分</span>
              <div class="mood-picker" role="radiogroup" aria-label="今日の気分">
                <label class="mood-option"><input type="radio" name="mood" value="great" /><span class="mood-face" aria-hidden="true">☀</span><span class="mood-name">最高</span></label>
                <label class="mood-option"><input type="radio" name="mood" value="good" /><span class="mood-face" aria-hidden="true">☺</span><span class="mood-name">いい感じ</span></label>
                <label class="mood-option"><input type="radio" name="mood" value="okay" /><span class="mood-face" aria-hidden="true">◡</span><span class="mood-name">ふつう</span></label>
                <label class="mood-option"><input type="radio" name="mood" value="low" /><span class="mood-face" aria-hidden="true">☁</span><span class="mood-name">いまひとつ</span></label>
                <label class="mood-option"><input type="radio" name="mood" value="tough" /><span class="mood-face" aria-hidden="true">☂</span><span class="mood-name">たいへん</span></label>
              </div>
            </div>

            <div class="writing-paper">
              <label class="visually-hidden" for="entry-content">日記の本文</label>
              <textarea id="entry-content" name="content" placeholder="今日はどんな一日でしたか？心に残ったこと、うれしかったこと、なんでも自由に書いてみましょう。"></textarea>
              <div class="writing-footer"><span id="word-count">0文字</span><span>⌘ / Ctrl + Enter で保存</span></div>
            </div>

            <div class="form-footer">
              <p class="form-hint">完璧な文章じゃなくて大丈夫。</p>
              <button class="save-button" type="submit"><span aria-hidden="true">↗</span> 日記を保存</button>
            </div>

            <section class="atmosphere-card" id="atmosphere" aria-label="この日の雰囲気" hidden>
              <div class="atmosphere-art" id="atmosphere-art" role="img" aria-label="この日の雰囲気を表す抽象画"></div>
              <div class="atmosphere-body">
                <p class="overline">TODAY'S ATMOSPHERE</p>
                <p class="atmosphere-phrase" id="atmosphere-phrase"></p>
                <div class="atmosphere-keywords" id="atmosphere-keywords"></div>
                <div class="atmosphere-palette" id="atmosphere-palette"></div>
                <p class="atmosphere-note">✦ 書いたことばから、この端末の中で色と模様を描いています</p>
              </div>
            </section>
          </form>

          <div class="editor-bottom"><span class="bottom-rule"></span><span>小さな記録が、あなたの物語になる。</span><span class="bottom-rule"></span></div>
        </section>
      </main>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
